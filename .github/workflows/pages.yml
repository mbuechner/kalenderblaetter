name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run browser tests
        run: |
          report="$RUNNER_TEMP/browser-tests.html"
          google-chrome --headless --no-sandbox --disable-dev-shm-usage \
            --virtual-time-budget=10000 --dump-dom \
            "file://$GITHUB_WORKSPACE/test/index.html" > "$report"
          cat "$report"
          grep -Fq '<main id="test-result" data-status="passed">' "$report"

      - name: Prepare static site
        if: github.ref == 'refs/heads/main'
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          cp index.html "$site/"
          cp -R js "$site/"

      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check deployment revision
        id: revision
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($head -eq $env:GITHUB_SHA) {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'current=true' -Encoding utf8
          } else {
            Write-Output '::notice::Skipping deployment because main has advanced.'
          }

      - name: Configure GitHub Pages
        if: steps.revision.outputs.current == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        if: steps.revision.outputs.current == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
